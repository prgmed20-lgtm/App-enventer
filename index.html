<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مخزون الكابلات</title>
<style>
:root{--o:#e8650a;--bg:#fff;--fg:#1a1a1a;--card:#f1f1f1;--bd:#cfcfcf;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1c1d20;--fg:#f2f2f2;--card:#2b2d31;--bd:#464a50}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:#2b2d31;color:#fff;padding:8px 12px;border-bottom:4px solid var(--o)}
header h1{font-size:18px;margin:0}
button,input,select{font:inherit;min-height:48px;border-radius:10px;border:1px solid var(--bd);padding:0 14px;background:var(--card);color:var(--fg)}
button{cursor:pointer;font-weight:600}
button.p{background:var(--o);border-color:var(--o);color:#fff}
#menuBtn{background:transparent;color:#fff;border:0;font-size:26px;width:48px;padding:0}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
label{display:block;margin:10px 0 4px;font-weight:600}
input,select{width:100%}
#drawer{position:fixed;inset:0 0 0 auto;width:260px;max-width:80%;background:#2b2d31;transform:translateX(100%);transition:.2s;z-index:20;padding:16px 10px}
#drawer.open{transform:none}
#drawer button{display:block;width:100%;text-align:start;background:transparent;border:0;color:#fff;margin:4px 0}
#drawer button.on{background:var(--o)}
#shade{position:fixed;inset:0;background:#0008;z-index:15;display:none}
#shade.open{display:block}
video{width:100%;max-height:50vh;background:#000;border-radius:10px}
.msg{padding:10px;border-radius:10px;background:#e8650a22;border:1px solid var(--o)}
.code{display:block;width:100%;text-align:start;margin:6px 0;word-break:break-all;direction:ltr}
.code.sel{background:var(--o);color:#fff}
.ltr{direction:ltr;unicode-bidi:plaintext}
.qty{font-size:22px;font-weight:700;color:var(--o)}
#toast{position:fixed;bottom:20px;inset-inline:16px;background:#1e7a3a;color:#fff;padding:12px;border-radius:10px;text-align:center;display:none;z-index:30}
#toast.err{background:#b3261e}
.pg{display:none}.pg.on{display:block}
</style>
</head>
<body>
<header><button id="menuBtn" aria-label="القائمة">☰</button><h1 id="title">مسح وتسجيل</h1></header>
<div id="shade"></div>
<nav id="drawer"></nav>
<main>
<section class="pg on" id="scan">
 <div class="row"><button class="p" id="liveBtn">📷 مسح حي</button><button class="p" id="capBtn">📸 التقاط صورة</button></div>
 <input type="file" id="file" accept="image/*" capture="environment" hidden>
 <div id="camBox" class="card" hidden>
  <video id="vid" playsinline muted></video>
  <div class="row" style="margin-top:8px"><button id="flipBtn">🔄 تبديل</button><button id="torchBtn" hidden>🔦</button><button id="stopBtn">⏹ إيقاف</button></div>
 </div>
 <div id="camMsg" class="msg" hidden></div>
 <div id="codes" class="card" hidden><b>الأكواد المقروءة — اختر Part Number:</b><div id="codeList"></div></div>
 <div class="card">
  <label for="pn">Part Number</label><input id="pn" class="ltr" autocomplete="off">
  <label for="qty">الكمية</label><input id="qty" type="number" inputmode="numeric" min="1" step="1">
  <label for="loc">الموقع</label><select id="loc"></select>
  <button class="p" id="saveBtn" style="width:100%;margin-top:14px">💾 حفظ</button>
 </div>
 <p id="engine" style="opacity:.7;font-size:14px"></p>
</section>
<section class="pg" id="inv"><input id="q" placeholder="بحث بـ Part Number أو الموقع"><div id="invList"></div></section>
<section class="pg" id="hist"><div id="histList"></div></section>
<section class="pg" id="locs">
 <div class="card row"><input id="newLoc" placeholder="اسم موقع جديد"><button class="p" id="addLoc" style="flex:0 0 auto">إضافة</button></div>
 <div id="locList"></div>
</section>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let db;
function toast(t,err){const e=$('#toast');e.textContent=t;e.className=err?'err':'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('cableinv',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('stock',{keyPath:'key'});d.createObjectStore('tx',{keyPath:'id'});d.createObjectStore('loc',{keyPath:'id'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const getAll=s=>new Promise((res,rej)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const putOne=(s,v)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)});
function applyDelta(pn,loc,delta,type){return new Promise((res,rej)=>{
 const t=db.transaction(['stock','tx'],'readwrite'),st=t.objectStore('stock'),k=pn+'|'+loc,g=st.get(k);
 g.onsuccess=()=>{const cur=g.result||{key:k,pn,loc,qty:0};
  if(cur.qty+delta<0){t.abort();rej(new Error('الكمية غير كافية'));return}
  cur.qty+=delta;cur.updated=Date.now();st.put(cur);
  t.objectStore('tx').add({id:uid(),ts:Date.now(),pn,loc,delta,type,after:cur.qty})};
 t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('أُلغيت العملية'))})}

/* ---------- navigation ---------- */
const PAGES=[['scan','مسح وتسجيل'],['inv','المخزون'],['hist','سجل العمليات'],['locs','المواقع']];
const dr=$('#drawer');
PAGES.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.onclick=()=>go(id);dr.append(b)});
function menu(o){dr.classList.toggle('open',o);$('#shade').classList.toggle('open',o)}
$('#menuBtn').onclick=()=>menu(!dr.classList.contains('open'));
$('#shade').onclick=()=>menu(false);
addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
function go(id){stopCam();document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id===id));
 dr.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 $('#title').textContent=PAGES.find(p=>p[0]===id)[1];menu(false);
 ({inv:renderInv,hist:renderHist,locs:renderLocs,scan:fillLocs})[id]()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam()});

/* ---------- scanning engine ---------- */
const WANT=['data_matrix','qr_code','pdf417','aztec','code_128','code_39','ean_8','ean_13','upc_a','upc_e','itf','codabar'];
let det=null,zxReady=null,stream=null,timer=null,facing='environment',lastSet='',lastT=0;
async function nativeDet(){
 if(det!==null)return det||null;
 if(!('BarcodeDetector' in window)){det=false;return null}
 try{const sup=await BarcodeDetector.getSupportedFormats();det=new BarcodeDetector({formats:WANT.filter(f=>sup.includes(f))})}catch{det=false}
 return det||null}
function loadZX(){return zxReady||(zxReady=new Promise((res,rej)=>{
 if(window.ZXing)return res();
 const s=document.createElement('script');
 s.src='https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.21.3/index.min.js';
 s.onload=res;s.onerror=()=>{zxReady=null;rej(new Error('تعذّر تحميل ZXing (يحتاج إنترنت)'))};document.head.append(s)}))}
function region(src,x,w){const c=document.createElement('canvas');c.width=w;c.height=src.height;c.getContext('2d').drawImage(src,x,0,w,src.height,0,0,w,src.height);return c}
async function detectAll(cv){
 const out=new Set(),w=cv.width,parts=[cv,region(cv,0,Math.ceil(w/2)),region(cv,Math.floor(w/2),Math.ceil(w/2))];
 const nd=await nativeDet();
 if(nd){for(const p of parts){try{(await nd.detect(p)).forEach(r=>r.rawValue&&out.add(r.rawValue))}catch{}}}
 else{await loadZX();const rd=new ZXing.BrowserMultiFormatReader();
  for(const p of parts){try{out.add((await rd.decodeFromImageUrl(p.toDataURL('image/png'))).getText())}catch{}}}
 return [...out]}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=1000;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},120)}catch{}
 navigator.vibrate&&navigator.vibrate(80)}
function showCodes(list){
 $('#codes').hidden=!list.length;const box=$('#codeList');box.innerHTML='';
 list.forEach(c=>{const b=document.createElement('button');b.className='code';b.textContent=c;
  b.onclick=()=>{$('#pn').value=c;box.querySelectorAll('.code').forEach(x=>x.classList.toggle('sel',x===b));$('#qty').focus()};box.append(b)});
 if(list.length===1)box.firstChild.click()}
function camMsg(t,showCap){const m=$('#camMsg');m.hidden=!t;m.textContent=t||''}
async function whyDenied(){
 try{const r=await navigator.permissions.query({name:'camera'});
  if(r.state==='denied')return 'الكاميرا محظورة لهذا الموقع في Brave. اضغط أيقونة القفل/الإعدادات بجانب العنوان ← إعدادات الموقع ← الكاميرا ← سماح، ثم أعد تحميل الصفحة.';
  return 'رُفض الطلب رغم أن حالة الإذن «'+r.state+'». اضغط «سماح» عند ظهور نافذة الإذن، أو أعد تحميل الصفحة.'}
 catch{return 'إذن الكاميرا مرفوض لهذا الموقع. فعّله من إعدادات الموقع في Brave ثم أعد تحميل الصفحة.'}}
async function startCam(){
 camMsg('');
 if(location.protocol==='file:')return camMsg('الملف مفتوح مباشرة من الهاتف (file://): المتصفح لا يسمح بالكاميرا الحية هنا حتى مع وجود الإذن. الحل: استضف الملف على HTTPS (Netlify Drop)، أو استخدم زر «التقاط صورة» الذي يعمل من الملف مباشرة.');
 if(window.self!==window.top)return camMsg('الصفحة مفتوحة داخل إطار/معاينة تمنع الكاميرا. افتحها في Brave مباشرة عبر رابط HTTPS، أو استخدم «التقاط صورة».');
 if(!window.isSecureContext)return camMsg('الكاميرا الحية غير متاحة: الصفحة غير آمنة (ليست HTTPS ولا localhost). استخدم زر «التقاط صورة».');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return camMsg('الكاميرا الحية غير مدعومة في هذا المتصفح. استخدم زر «التقاط صورة».');
 stopCam();
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
 }catch(e){
  if(e.name==='NotAllowedError')return camMsg(await whyDenied()+' أو استخدم «التقاط صورة».');
  const m={NotAllowedError:'إذن الكاميرا مرفوض. اسمح بالكاميرا من إعدادات المتصفح أو استخدم «التقاط صورة».',
   NotFoundError:'لا توجد كاميرا على هذا الجهاز.',NotReadableError:'الكاميرا مستخدمة من تطبيق آخر. أغلقه ثم أعد المحاولة.',
   OverconstrainedError:'إعدادات الكاميرا غير مدعومة.'};
  return camMsg((m[e.name]||('فشل تشغيل الكاميرا: '+e.name))+' يمكنك استخدام «التقاط صورة» كبديل.')}
 const v=$('#vid');v.srcObject=stream;await v.play().catch(()=>{});$('#camBox').hidden=false;
 const tr=stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
 $('#torchBtn').hidden=!cap.torch;
 if(cap.focusMode&&cap.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
 let busy=false;
 timer=setInterval(async()=>{
  if(busy||!v.videoWidth)return;busy=true;
  try{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
   const codes=await detectAll(c);
   if(codes.length){const key=codes.slice().sort().join('||'),now=Date.now();
    if(key!==lastSet||now-lastT>3000){lastSet=key;lastT=now;beep();showCodes(codes)}}
  }catch(e){camMsg(e.message+' — استخدم «التقاط صورة».');stopCam()}
  busy=false},450)}
function stopCam(){clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const v=$('#vid');if(v)v.srcObject=null;$('#camBox').hidden=true}
$('#liveBtn').onclick=startCam;
$('#stopBtn').onclick=stopCam;
$('#flipBtn').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
$('#torchBtn').onclick=async()=>{const tr=stream&&stream.getVideoTracks()[0];if(!tr)return;
 $('#torchBtn').dataset.on=$('#torchBtn').dataset.on?'':'1';
 tr.applyConstraints({advanced:[{torch:!!$('#torchBtn').dataset.on}]}).catch(()=>toast('الفلاش غير مدعوم',1))};
$('#capBtn').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;camMsg('');toast('جارٍ فك الكود…');
 try{const bm=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  const codes=await detectAll(c);
  if(codes.length){beep();showCodes(codes)}else{showCodes([]);camMsg('لم يُعثر على كود في الصورة. اقترب أكثر وتأكد من الإضاءة، أو اكتب Part Number يدوياً.')}
 }catch(err){camMsg('تعذّر فك الصورة: '+err.message)}};

/* ---------- register ---------- */
async function fillLocs(){
 const sel=$('#loc'),keep=sel.value,ls=(await getAll('loc')).filter(l=>l.active);
 sel.innerHTML='';ls.forEach(l=>sel.append(new Option(l.name,l.name)));if(keep)sel.value=keep;
 nativeDet().then(n=>$('#engine').textContent='Secure context: '+(isSecureContext?'نعم':'لا')+' — المحرك: '+(n?'Native BarcodeDetector':'ZXing (يتطلب إنترنت لأول تحميل)'))}
$('#saveBtn').onclick=async()=>{
 const pn=$('#pn').value.trim(),qty=Number($('#qty').value),loc=$('#loc').value;
 if(!pn)return toast('أدخل Part Number',1);
 if(!Number.isInteger(qty)||qty<=0)return toast('الكمية يجب أن تكون عدداً صحيحاً أكبر من صفر',1);
 if(!loc)return toast('اختر الموقع',1);
 try{await applyDelta(pn,loc,qty,'receive');toast('✔ تم الحفظ: '+pn+' ×'+qty);
  $('#qty').value='';$('#pn').value='';showCodes([])}catch(e){toast(e.message,1)}};

/* ---------- inventory / history / locations ---------- */
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function renderInv(){
 const q=$('#q').value.trim().toLowerCase(),box=$('#invList');box.innerHTML='';
 const rows=(await getAll('stock')).filter(r=>r.qty>0&&(r.pn+' '+r.loc).toLowerCase().includes(q)).sort((a,b)=>a.pn.localeCompare(b.pn));
 if(!rows.length)return box.append(el('p','msg','لا توجد عناصر.'));
 const total=rows.reduce((s,r)=>s+r.qty,0);box.append(el('p','',`الأصناف: ${new Set(rows.map(r=>r.pn)).size} — الإجمالي: ${total}`));
 rows.forEach(r=>{const c=el('div','card row'),i=el('div');i.append(el('div','ltr',r.pn),el('small','',r.loc));
  const n=el('div','qty',r.qty),b=el('button','','تصحيح −');b.style.flex='0 0 auto';
  b.onclick=async()=>{const v=Number(prompt('الكمية المراد خصمها من '+r.pn+' @ '+r.loc));
   if(!Number.isInteger(v)||v<=0)return;
   try{await applyDelta(r.pn,r.loc,-v,'correction');toast('تم التصحيح');renderInv()}catch(e){toast(e.message,1)}};
  c.append(i,n,b);box.append(c)})}
$('#q').oninput=renderInv;
async function renderHist(){const box=$('#histList');box.innerHTML='';
 const rows=(await getAll('tx')).sort((a,b)=>b.ts-a.ts).slice(0,300);
 if(!rows.length)return box.append(el('p','msg','لا توجد عمليات.'));
 rows.forEach(t=>{const c=el('div','card');
  c.append(el('div','ltr',t.pn+' @ '+t.loc),el('div','',(t.delta>0?'+':'')+t.delta+' → '+t.after+(t.type==='correction'?' (تصحيح)':'')),
   el('small','',new Date(t.ts).toLocaleString('ar')+' · '+t.id));box.append(c)})}
async function renderLocs(){const box=$('#locList');box.innerHTML='';
 (await getAll('loc')).sort((a,b)=>a.order-b.order).forEach(l=>{const c=el('div','card row'),n=el('div','',l.name+(l.active?'':' (معطّل)'));
  const e=el('button','','تعديل'),t=el('button','',l.active?'تعطيل':'تفعيل');
  e.onclick=async()=>{const v=(prompt('الاسم الجديد',l.name)||'').trim();if(v){l.name=v;await putOne('loc',l);renderLocs()}};
  t.onclick=async()=>{l.active=!l.active;await putOne('loc',l);renderLocs()};
  c.append(n,e,t);box.append(c)})}
$('#addLoc').onclick=async()=>{const v=$('#newLoc').value.trim();if(!v)return;
 const ls=await getAll('loc');if(ls.some(l=>l.name===v))return toast('الموقع موجود',1);
 await putOne('loc',{id:uid(),name:v,active:true,order:Date.now()});$('#newLoc').value='';renderLocs()};

/* ---------- init ---------- */
(async()=>{
 try{db=await openDB()}catch(e){document.body.prepend(el('p','msg','تعذّر فتح قاعدة البيانات: '+e.message));return}
 if(!(await getAll('loc')).length){
  const seed=['Warehouse','Machine 01','Machine 02','Machine 03','Cutting Area','Production Line 01','Production Line 02','Quality Area','Other'];
  for(let i=0;i<seed.length;i++)await putOne('loc',{id:uid(),name:seed[i],active:true,order:i})}
 go('scan')})();
</script>
</body>
</html>
